<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    circle, line { stroke: #000000; fill: none; }
    .filled { fill: #000000; stroke: none; }
    @media (prefers-color-scheme: dark) {
      circle, line { stroke: #ffffff; }
      .filled { fill: #ffffff; }
    }
  </style>
  <!-- Selected answer -->
  <circle class="filled" cx="7" cy="8" r="3.5"/>
  <!-- Unselected answers -->
  <circle cx="7" cy="16" r="3.5" stroke-width="2.2"/>
  <circle cx="7" cy="24" r="3.5" stroke-width="2.2"/>
  <!-- Answer text lines -->
  <line x1="14" y1="8"  x2="29" y2="8"  stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="29" y2="16" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="24" x2="24" y2="24" stroke-width="2.2" stroke-linecap="round"/>
</svg>
